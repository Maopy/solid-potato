[package]
name = "live-archive-tauri"
version = "0.5.14"
edition = "2024"
publish = false

[workspace]

[dependencies]
live-archive-core = { path = "../.." }
anyhow = "1"
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }


