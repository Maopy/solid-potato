version: 1
nickname_mapping:
  file: nickname-mapping.yml
mode: candidate_fill_only
room:
  platform: wechat_channels
  adapter: wechat_channels.desktop_probe
  url: https://channels.weixin.qq.com/web/pages/live
injection:
  system_proxy: true
  proxy_port: 2024
  mitmdump: mitmdump
storage:
  raw_messages: true
  retention:
    enabled: true
    raw_days: 7
    raw_max_mib: 2048
    audit_days: 30
    preserved_runs: []
  directory: ../data/wechat
duration_seconds: 0
candidate_preview:
  enabled: true
  # 留空时从当前直播页绑定主播身份；未识别时暂停礼物感谢，仍可录屏。
  recipient_from_page: true
  recipient_user_id: ''
rules:
  gift:
    variation:
      enabled: true
    template: '感谢{nickname}送来的{gift_list}'
    emojis: ['🎁', '🎉', '💖', '✨', '🌟', '💐']
    enabled: true
    show_quantity: false
    overflow_template: '感谢礼物飘屏'
  welcome:
    # 每个直播间收集 30 秒后合并欢迎。
    enabled: true
  supporter_welcome:
    enabled: true
    template: '欢迎{title}{nickname}来到直播间，感谢支持！'
  fansclub_joined:
    enabled: false
  upgrade:
    enabled: false
limits:
  max_text_chars: 80
sending:
  automatic: true

# Optional full sender account user ID for network echo matching.
# Required for Douyin echo confirmation; recommended for WeChat.
# delivery:
#   actor_user_id: 'sender-account-user-id'

# 定时文案默认关闭；启用时还需要 sending.automatic: true。
timed_messages:
  enabled: false
  interval_seconds: 300
  messages:
    - '新来的朋友欢迎呀，喜欢直播可以点个关注✨'
    - '精彩继续，喜欢就一起聊起来🎉'
    - '感谢大家的陪伴，欢迎常来玩💖'

# 点赞独立开关；载入页面后仍需在面板手动开启。
likes:
  enabled: true
  mode: continuous
  interval_ms: 800
  every_minutes: 10
  batch_count: 200
  missed: catch_up_once
  target_selector: null
