name: Windows
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RUST_TEST_THREADS: '4'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install mitmproxy==12.3.0
      - run: cargo test -p live-archive-core --locked
      - run: python -X utf8 tests/release_package_test.py
      - run: python -X utf8 tests/windows_asyncio_test.py
      - run: python -X utf8 tests/firered_worker_test.py
      - run: node --test tests/*.test.cjs
      - run: cargo build -p live-archive-core --release --locked
      - run: python -X utf8 release/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish tagged Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          $manifestVersion = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($manifestVersion -ne $releaseVersion) { throw 'Release tag does not match Cargo.toml' }
          $archivePath = "dist/live-archive-moderation-$releaseVersion-windows-x64.zip"
          gh release create $env:GITHUB_REF_NAME $archivePath "$archivePath.sha256" --verify-tag --title "v$releaseVersion Windows" --notes-file "docs/moderation-release-$releaseVersion.md"
