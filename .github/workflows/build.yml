name: Build and release
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      RUST_TEST_THREADS: '4'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native packaging target
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          python -c "import os; from release.package import host_target; actual = host_target(); expected = os.environ['PACKAGE_TARGET']; assert actual == expected, f'{actual} != {expected}'"
      - run: python -m pip install mitmproxy==12.3.0
      - run: cargo test -p live-archive-core --locked 2>&1 | tee cargo-test.log
      - run: python -X utf8 tests/release_package_test.py
      - run: python -X utf8 tests/release_artifacts_test.py
      - run: python -X utf8 tests/windows_asyncio_test.py
      - run: python -X utf8 tests/firered_worker_test.py
      - run: node --test tests/*.test.cjs
      - run: cargo build -p live-archive-core --release --locked
      - run: python -X utf8 release/package.py --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
      - name: Summarize failed Rust checks
        if: failure()
        run: |
          if [ -f cargo-test.log ]; then
            echo '### Rust check failure' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 cargo-test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('cargo-test.log').read_text(encoding='utf-8', errors='replace').splitlines()[-70:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Rust failure details::{text}')
          PY
          fi
  publish:
    name: Publish all platforms
    needs: core
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release and checksums
        run: python -X utf8 release/verify_artifacts.py --tag "$GITHUB_REF_NAME" release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file "docs/moderation-release-${GITHUB_REF_NAME#v}.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
