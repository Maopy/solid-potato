<style>

<body>
<header><h1>直播助手 <small>中控台 / 实时内容</small></h1><nav><button id="tab-rooms" class="active">直播间</button><button id="tab-downloads">下载任务</button><button id="deepseek-settings">AI 设置</button></nav></header>
<p id="notice" role="status"></p>
<div id="rooms-view">
  <div class="workspace-bar"><div><strong id="workspace-status">直播间</strong><small>每个窗口可独立切换直播间</small></div><div class="layout-switch" role="group" aria-label="直播间显示数量"><button id="layout-single">单直播间</button><button id="layout-double" class="active">双直播间</button></div></div>
  <div id="panels"></div>
  <div class="workspace-foot">语音按说完时间排列，可能有播放延迟 · 每个直播间保留最近 30 分钟</div>
</div>
<div id="downloads-view" hidden><section id="userscript-setup" hidden><strong>抖音通过用户脚本接入</strong><p>安装 Tampermonkey 后安装脚本，再打开抖音直播间并刷新页面。</p><a id="userscript-install" target="_blank" rel="noreferrer">安装 / 更新抖音场控脚本</a><p class="muted">视频号请在微信中进入要使用的直播间。</p></section><h2>下载任务</h2><div id="downloads"></div><p id="exit-hint" class="muted">结束使用时，在启动终端按 Ctrl-C，等待视频收尾和代理恢复后退出。</p></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const RETENTION_MS = 30 * 60 * 1000;
// Chat becomes stale more quickly than speech, which can arrive after transcription.
const suggestionMaxAge = entry => entry.kind === 'chat' ? 15000 : 30000;
const token = location.hash.slice(1), views = new Map(), panels = new Map();
if (new URLSearchParams(location.search).get('desktop') === '1') $('exit-hint').textContent = '结束使用时关闭窗口，等待视频收尾和代理恢复。';
let state = {rooms: [], downloads: []}, slots = [null, null], layoutMode = 'double', busy = false, tab = 'rooms';
let pendingRoomSettings = new URLSearchParams(location.search).get('settings');
const speechNames = {off:'未开启', starting:'模型准备中', listening:'等待说话', transcribing:'识别中', error:'识别异常', disconnected:'连接中断'};

async function api(path, body) {
  const response = await fetch('/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: {Authorization:'Bearer ' + token, ...(body ? {'Content-Type':'application/json'} : {})},
    ...(body ? {body:JSON.stringify(body)} : {})
  });
  const value = await response.json();
  if (!response.ok) throw Error(value.error || '中控连接失败，请通过启动程序打开本页');
  return value;
}
function view(id) {
  if (!views.has(id)) views.set(id, {entries:[], query:'', from:'', to:'', compose:'', speech:true, chat:true, following:true, anchorIds:new Set(), scroll:0, selected:null, signature:'', range:false, expanded:new Set(), requestVersion:0});
  return views.get(id);
}
function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}
async function openDeepSeekSettings() {
  const dialog = el('dialog', undefined, 'rule-dialog');
  const title = el('h2', 'DeepSeek 设置');
  const status = el('p', '正在读取设置…', 'muted');
  const label = el('label', 'API Key', 'rule-text');
  const key = el('input'); key.type = 'password'; key.autocomplete = 'off'; key.placeholder = '输入新密钥'; key.maxLength = 512; label.append(key);
  const hint = el('p', '密钥保存在本机系统凭据管理器中，保存后不会显示原文。', 'muted');
  const error = el('p', '', 'rule-error');
  const buttons = el('div', undefined, 'rule-buttons');
  const remove = el('button', '删除密钥'), close = el('button', '关闭'), save = el('button', '保存密钥');
  buttons.append(remove, close, save); dialog.append(title, status, label, hint, error, buttons); document.body.append(dialog);
  dialog.addEventListener('close', () => { key.value = ''; dialog.remove(); });
  close.onclick = () => dialog.close();
  const showStatus = configured => { status.textContent = configured ? '已配置密钥，可输入新密钥替换。' : '尚未配置密钥。'; remove.disabled = !configured; };
  save.onclick = async () => { save.disabled = true; error.textContent = ''; try { const result = await api('deepseek-key', {action:'save',key:key.value}); key.value = ''; showStatus(result.configured); } catch (e) { error.textContent = e.message; } finally { save.disabled = false; } };
  remove.onclick = async () => { remove.disabled = true; error.textContent = ''; try { const result = await api('deepseek-key', {action:'delete'}); key.value = ''; showStatus(result.configured); } catch (e) { error.textContent = e.message; remove.disabled = false; } };
  dialog.showModal();
  try { showStatus((await api('deepseek-key')).configured); } catch (e) { status.textContent = ''; error.textContent = e.message; }
}
$('deepseek-settings').onclick = () => { void openDeepSeekSettings(); };
function fanBadge(level) {
  const badge = el('span', String(level), 'fan-badge');
  badge.setAttribute('aria-label', '灯牌 ' + level + ' 级');
  badge.title = '灯牌 ' + level + ' 级';
  return badge;
}
function displayTime(entry) { return entry.kind === 'speech' ? entry.end_ms : entry.at_ms; }
function clock(ms) { return new Date(ms).toLocaleTimeString('zh-CN', {hour12:false}); }
function action(label, fn, disabled = false, on = false) {
  const button = el('button', label, on ? 'on' : '');
  button.disabled = disabled || busy;
  button.onclick = async () => {
    if (busy) return;
    busy = true; button.disabled = true;
    try { await fn(); $('notice').textContent = ''; }
    catch (error) { $('notice').textContent = error.message === 'unknown room' ? '直播间已关闭或断开，请选择当前直播间' : error.message; }
    finally { busy = false; await refresh(); }
  };
  return button;
}
function visibleRooms() { return slots.slice(0, layoutMode === 'double' && state.rooms.length > 1 ? 2 : 1).filter(Boolean); }
function normalizeSlots() {
  const ids = state.rooms.map(r => r.id);
  for (let i = 0; i < 2; i++) {
    if (!ids.includes(slots[i]) || (i === 1 && slots[i] === slots[0])) slots[i] = ids.find(id => id !== slots[1-i]) || null;
  }
  if (!slots[0] && slots[1]) [slots[0], slots[1]] = [slots[1], null];
}
function switchRoom(index, id) {
  const previous = slots[index], other = 1 - index;
  if (slots[other] === id) slots[other] = previous;
  slots[index] = id;
  reconcilePanels();
  void loadVisibleTimelines();
}
function reconcilePanels() {
  normalizeSlots();
  const visible = visibleRooms();
  for (const panel of panels.values()) view(panel.id).scroll = panel.list.scrollTop;
  for (const [id, panel] of panels) if (!visible.includes(id)) {
    view(id).scroll = panel.list.scrollTop;
    panel.observer.disconnect(); panel.root.remove(); panels.delete(id);
  }
  $('panels').classList.toggle('dual', visible.length === 2);
  $('workspace-status').textContent = '直播间 · ' + state.rooms.filter(r => r.control?.connected_pages).length + ' 个已连接';
  for (const mode of ['single', 'double']) {
    $('layout-' + mode).classList.toggle('active', layoutMode === mode);
    $('layout-' + mode).setAttribute('aria-pressed', String(layoutMode === mode));
  }
  const created = [];
  for (const [index, id] of visible.entries()) {
    const exists = panels.has(id);
    const panel = panels.get(id) || createPanel(id);
    if (!exists) created.push(panel);
    panel.index = index;
    const target = $('panels').children[index];
    if (target !== panel.root) $('panels').insertBefore(panel.root, target || null);
    drawHeader(panel);
  }
  for (const panel of created) render(panel);
  for (const panel of panels.values()) {
    const v = view(panel.id); panel.list.scrollTop = v.following ? panel.list.scrollHeight : v.scroll;

      else { v.replyOpen.add(entry.id); void requestReply(entry.id, panel); }
      updateVisibleRatings(panel);
    };
  }
  const open = v.replyOpen.has(entry.id); trigger.title = open ? '收起 AI 回复建议' : 'AI 回复建议'; trigger.setAttribute('aria-label',trigger.title); trigger.setAttribute('aria-expanded', String(open));

  if (!open) { box?.remove(); delete node.dataset.replySignature; return; }

  const signature = JSON.stringify(advice || null);
  if (box && node.dataset.replySignature === signature) return;

  box.replaceChildren(); node.dataset.replySignature = signature;
  if (!advice || advice.state === 'pending') { box.append(el('span','正在针对本条留言挑选建议…','muted')); return; }
  if (advice.state === 'error') {

    const retry = el('button','重试','reply-trigger'); retry.onclick = () => { void requestReply(entry.id,panel); }; box.append(retry); return;
  }
  box.append(el('div','针对本条留言 · 上下文仅供参考','reply-context'));
  for (const suggestion of advice.suggestions || []) {
    const row = el('div',undefined,'reply-option'), copy = el('button','复制','reply-copy');
    row.append(el('b',suggestion.direction),el('p',suggestion.text),copy);
    copy.onclick = async () => { try { await navigator.clipboard.writeText(suggestion.text); copy.textContent='已复制'; } catch (_) { copy.textContent='请手动复制'; } };
    box.append(row);

}
function updateRating(node, entry) {
  let badge = node.querySelector('.attention-score');
  if (!entry.rating) { badge?.remove(); return; }
  if (!badge) { badge = el('span', undefined, 'attention-score'); node.insertBefore(badge,node.querySelector('.reply-trigger')); }
  const rating = entry.rating, scored = rating.state === 'scored' && Number.isFinite(rating.score);
  badge.textContent = scored ? rating.score + '分' : ({pending:'评分中',busy:'待重试',error:'评分异常'}[rating.state] || '未评分');
  badge.className = 'attention-score' + (scored && rating.score >= 75 ? ' high' : scored ? '' : rating.state === 'error' ? ' error' : rating.state === 'busy' ? ' warning' : ' muted');
  badge.title = scored ? '关注分 ' + rating.score + '/100 · 越高越值得主播关注（不是准确率）' : '本地 StartLux · ' + badge.textContent;
  badge.setAttribute('aria-label', badge.title);
}
function updateVisibleRatings(panel) {
  const entries = new Map(view(panel.id).entries.map(e => [e.id, e]));
  for (const node of panel.list.querySelectorAll('.entry.chat')) {
    const entry = entries.get(node.dataset.id); if (entry) { updateRating(node, entry); updateReply(node, entry, panel); }
  }
}
function trimHistory(v) {
  const cutoff = Date.now() - RETENTION_MS;
  v.entries = v.entries.filter(entry => displayTime(entry) >= cutoff);
  const ids = new Set(v.entries.map(entry => entry.id));
  v.anchorIds = new Set([...v.anchorIds].filter(id => ids.has(id)));
  if (v.replyOpen) v.replyOpen = new Set([...v.replyOpen].filter(id => ids.has(id)));
  if (v.replyErrors) for (const id of v.replyErrors.keys()) if (!ids.has(id)) v.replyErrors.delete(id);
  if (v.selected && !ids.has(v.selected)) v.selected = null;
  const seconds = new Set(v.entries.map(entry => Math.floor(displayTime(entry) / 1000)));
  v.expanded = new Set([...v.expanded].filter(second => seconds.has(second)));
}
function expireDisplayed(panel) {
  const v = view(panel.id), ids = new Set(v.entries.map(entry => entry.id));
  const list = panel.list, height = list.scrollHeight, top = list.scrollTop;
  for (const node of list.querySelectorAll('[data-id]')) if (!ids.has(node.dataset.id)) node.remove();
  for (const row of list.querySelectorAll('.moment')) {
    if (!row.querySelector('[data-id]')) { row.remove(); continue; }
    for (const details of row.querySelectorAll('details')) {
      const count = details.querySelectorAll('[data-id]').length;
      if (!count) details.remove();
      else details.querySelector('summary').textContent = '展开另外 ' + count + ' 条留言';
    }
  }
  if (!v.selected) for (const node of list.querySelectorAll('.selected,.related')) node.classList.remove('selected', 'related');
  if (!list.children.length) list.append(el('div', v.entries.length ? '回看内容已过期，点击“回到实时”查看新内容。' : '最近 30 分钟暂无内容', 'empty'));
  list.scrollTop = Math.max(0, top - Math.max(0, height - list.scrollHeight));
  v.scroll = list.scrollTop;
}
function render(panel, scroll) {
  const v = view(panel.id); trimHistory(v);
  const list = panel.list, top = scroll ?? v.scroll;
  list.replaceChildren();
  const entries = filtered(v), groups = new Map();
  for (const entry of entries) {
    const second = Math.floor(displayTime(entry) / 1000);
    if (!groups.has(second)) groups.set(second, []);
    groups.get(second).push(entry);
  }
  let lastDay = '';
  for (const [second, items] of groups) {
    const row = el('div', undefined, 'moment'); row.dataset.second = String(second);
    const time = el('time', clock(second * 1000)), day = new Date(second * 1000).toLocaleDateString('zh-CN');
    if (day !== lastDay) { time.prepend(el('small', day)); lastDay = day; }
    const events = el('div', undefined, 'events');
    // Keep speech and comments in one chronological stream; only all-comment groups fold.
    const fold = items.length > 3 && items.every(e => e.kind === 'chat');
    for (const e of fold ? items.slice(0, 3) : items) events.append(entryNode(e, panel));
    if (fold) {
      const more = el('details'); more.open = v.expanded.has(second);
      more.addEventListener('toggle', () => { if (more.open) v.expanded.add(second); else v.expanded.delete(second); });
      more.append(el('summary', '展开另外 ' + (items.length - 3) + ' 条留言'));
      for (const e of items.slice(3)) more.append(entryNode(e, panel));
      events.append(more);
    }
    row.append(time, events); list.append(row);
  }
  if (!entries.length) {
    const empty = el('div', undefined, 'empty');
    empty.append(el('strong', v.query || v.from || v.to ? '没有匹配的内容' : '等待直播内容'), el('span', v.query || v.from || v.to ? '试试其他关键词或时间范围。' : '播放直播并开启语音后，文字会按时间显示在这里。'));
    list.append(empty);
  }
  updateFollow(panel); list.scrollTop = v.following ? list.scrollHeight : top; v.scroll = list.scrollTop;
}
async function loadTimeline(id) {
  const v = view(id), requestVersion = ++v.requestVersion, data = await api('timeline', {id});
  if (requestVersion !== v.requestVersion) return;
  if (v.run && v.run !== data.run_id) { v.following = true; v.selected = null; v.signature = ''; }
  v.run = data.run_id;
  v.entries = data.entries; trimHistory(v);
  const signature = v.entries.map(e => e.id).join('|');
  const panel = panels.get(id);
  if (signature !== v.signature) {
    v.signature = signature;
    if (panel) { if (v.following) render(panel); else { expireDisplayed(panel); updateFollow(panel); } }
  }
  if (panel) updateVisibleRatings(panel);
  if (panel) void generateDeepSeek(panel);
}
async function generateDeepSeek(panel) {
  const v = view(panel.id), now = Date.now();
  if (!v.deepseekEnabled || v.deepseekPending || now < (v.deepseekNext || 0)) return;
  const entries = v.entries.filter(e => ['speech','chat'].includes(e.kind) && (panel.source.value === 'both' || e.kind === panel.source.value) && displayTime(e) <= now && now - displayTime(e) <= suggestionMaxAge(e) && e.id !== v.deepseekLastTarget).slice(-6).map(e => ({id:e.id,kind:e.kind,text:[...e.text].slice(0,100).join('')}));
  if (!entries.length) return;
  const seconds = Math.max(10, Math.min(3600, Number(panel.interval.value) || 60));
  v.deepseekNext = now + seconds * 1000; v.deepseekPending = true; panel.suggestion.textContent = '正在生成建议…';
  try {
    const result = await api('deepseek-reply', {id:panel.id,entries});
    if (!v.deepseekEnabled || panels.get(panel.id) !== panel) return;
    const target = entries.find(e => e.id === result.target_id);
    const original = v.entries.find(e => e.id === result.target_id);
    if (result.skipped || !target || !original || Date.now() - displayTime(original) > suggestionMaxAge(original)) { panel.suggestion.textContent = '没有合适的近期建议'; return; }
    v.deepseekLastTarget = target.id;
    panel.suggestion.replaceChildren(document.createTextNode((target.kind === 'speech' ? '主播' : '公屏') + '：' + target.text + ' → ' + result.reply + ' '));
    const use = el('button','采用'); use.onclick = () => { if (Date.now() - displayTime(original) > suggestionMaxAge(original)) { panel.suggestion.textContent = '建议已过期'; return; } panel.compose.value = result.reply; v.compose = result.reply; panel.suggestion.textContent = '已填入输入框，请确认后发送'; };
    panel.suggestion.append(use);
  } catch (error) { panel.suggestion.textContent = error.message; }
  finally { v.deepseekPending = false; }
}
async function loadVisibleTimelines() {
  const results = await Promise.allSettled(visibleRooms().map(loadTimeline));
  // A room can close after the room list was fetched but before its timeline.
  // The next refresh removes it; other failures must still be shown.
  const failed = results.find(result => result.status === 'rejected' && result.reason?.message !== 'unknown room');
  if (failed) $('notice').textContent = failed.reason.message;
}
function drawDownloads() {
  const list = $('downloads'); list.replaceChildren();
  if (!state.downloads.length) list.append(el('p', '暂无录制任务。进入并播放直播后，点击对应直播间的“录制直播”。', 'muted'));
  for (const task of state.downloads) {
    const row = el('div', undefined, 'task'), names = {waiting:'等待启动', downloading:'录制中', paused:'已暂停', finished:'已完成', failed:'失败'};
    row.append(el('div', task.name + ' · ' + (names[task.status] || task.status) + (task.error ? ' · ' + task.error : ''), 'task-title'));
    const next = ['waiting', 'downloading'].includes(task.status) ? 'pause' : 'start';
    row.append(action(next === 'pause' ? '暂停' : '继续', () => api('download', {id:task.id, action:next})), action('移除', () => api('download', {id:task.id, action:'delete'}))); list.append(row);
  }
}
async function refresh() {
  try {
    state = await api('state');
    $('userscript-setup').hidden = !state.userscript_install_url;
    if (state.userscript_install_url) $('userscript-install').href = state.userscript_install_url;
    if (tab === 'rooms') { reconcilePanels(); await loadVisibleTimelines(); }
    else drawDownloads();
    if (pendingRoomSettings) {
      const room = state.rooms.find(item => item.id === pendingRoomSettings);
      if (room?.control?.connected_pages) {
        pendingRoomSettings = null;
        try { await openRules(room); } catch (error) { $('notice').textContent = error.message; }
      }
    }
  } catch (error) { $('notice').textContent = error.message; }
}
for (const mode of ['single', 'double']) $('layout-' + mode).onclick = () => { layoutMode = mode; reconcilePanels(); void loadVisibleTimelines(); };
for (const name of ['rooms', 'downloads']) $('tab-' + name).onclick = () => {
  tab = name;
  for (const n of ['rooms', 'downloads']) { $(n + '-view').hidden = n !== name; $('tab-' + n).classList.toggle('active', n === name); }
  if (name === 'downloads') drawDownloads();
  else { reconcilePanels(); for (const panel of panels.values()) render(panel); void loadVisibleTimelines(); }
};
async function poll() { if (!busy) await refresh(); setTimeout(poll, 2000); }
void poll();
