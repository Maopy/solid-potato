<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>直播助手 · 统一控制台</title><style>body{font:16px system-ui;background:#f4f6f8;color:#18212b;max-width:960px;margin:36px auto;padding:0 20px}h1{font-size:26px}.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}section{background:white;border:1px solid #dde3e9;border-radius:12px;padding:20px;margin-bottom:16px}button,a{font:inherit}button{border:1px solid #cbd5df;border-radius:7px;padding:8px 12px;margin:5px 5px 5px 0;cursor:pointer}button.on{background:#087f5b;color:white;border-color:#087f5b}button:disabled{opacity:.5;cursor:default}p{line-height:1.6}.muted{color:#526171}#notice{color:#b54708;white-space:pre-wrap}.task{padding:10px 0;border-top:1px solid #eee;overflow-wrap:anywhere}a{color:#076a9c}</style></head><body><h1>直播助手</h1><p class="muted">抖音与视频号共用此入口。先打开直播页，连接后开启场控；录制独立控制，关闭场控不会停止录制。</p><p id="notice"></p><section id="userscript-setup" hidden><strong>抖音通过用户脚本接入</strong><p>安装 Tampermonkey 后，点击安装场控脚本。安装一次即可；打开任意抖音直播间后刷新页面，每个直播间单独开启场控。</p><a id="userscript-install" target="_blank" rel="noreferrer">安装 / 更新抖音场控脚本</a><p class="muted">请关闭 LiveBot 等其他脚本的自动发送功能，避免重复回复。视频号继续使用代理；抖音无需代理证书。</p></section><div id="rooms" class="rooms"></div><section><h2>下载任务</h2><div id="downloads">暂无录制任务</div></section><p class="muted">结束使用时，在启动终端按 Ctrl-C，等待视频收尾和代理恢复后退出。</p><script>
const token=location.hash.slice(1);let working=false;
const notice=document.getElementById('notice');
async function api(path,body){const response=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw Error(data.error||'控制台连接失败，请通过启动程序打开本页');return data;}
function button(label,action,disabled=false){const b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=async()=>{working=true;b.disabled=true;try{await action();notice.textContent='';}catch(e){notice.textContent=e.message;}finally{working=false;await refresh();}};return b;}
async function refresh(){if(working)return;try{const state=await api('state');document.getElementById('userscript-setup').hidden=!state.userscript_install_url;if(state.userscript_install_url)document.getElementById('userscript-install').href=state.userscript_install_url;const rooms=document.getElementById('rooms');rooms.replaceChildren();for(const r of state.rooms){const card=document.createElement('section');const h=document.createElement('h2');h.textContent=(r.platform==='douyin'?'抖音':'视频号')+' · '+(r.label||r.id);const s=document.createElement('p');const c=r.control||{};s.textContent=(c.connected_pages?'直播页已连接':'直播页未连接')+' · 场控'+(c.enabled?'已开启':'已关闭')+(c.blocked?' · 发送未确认，已暂停后续发送':'');const link=document.createElement(r.platform==='douyin'?'a':'p');if(r.platform==='douyin'){link.href=r.url;link.target='_blank';link.rel='noreferrer';link.textContent='打开直播页';}else{link.textContent='请在微信中进入要使用的直播间';link.className='muted';}const toggle=button(c.enabled?'关闭场控':'开启场控',()=>api('moderation',{id:r.id,enabled:!c.enabled}));toggle.setAttribute('role','switch');toggle.setAttribute('aria-checked',String(!!c.enabled));if(c.enabled)toggle.className='on';const record=button('录制直播',()=>api('record',{id:r.id}),!c.recording||!c.connected_pages);const feedback=document.createElement('p');feedback.className='muted';feedback.textContent=c.recording_result?.message||'';card.append(h,s,link,document.createElement('br'),toggle,record,feedback);rooms.appendChild(card);}
const list=document.getElementById('downloads');list.replaceChildren();if(!state.downloads.length)list.textContent='暂无录制任务。进入并播放直播后点击“录制直播”。';for(const task of state.downloads){const row=document.createElement('div');row.className='task';const t=document.createElement('div');const names={waiting:'等待启动',downloading:'录制中',paused:'已暂停',finished:'已完成',failed:'失败'};t.textContent=task.name+' · '+(names[task.status]||task.status)+(task.error?' · '+task.error:'');row.appendChild(t);const action=['waiting','downloading'].includes(task.status)?'pause':'start';row.append(button(action==='pause'?'暂停':'继续',()=>api('download',{id:task.id,action})),button('移除',()=>api('download',{id:task.id,action:'delete'})));list.appendChild(row);}}catch(e){notice.textContent=e.message;}}
refresh();setInterval(refresh,2000);
</script></body></html>
